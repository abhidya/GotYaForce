<!doctype html>
<!-- Gotcha Force (GG4E) browser recreation — app entry HTML. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Mobile viewport. viewport-fit=cover lets the canvas fill past the notch/home
      indicator (the overlay keeps clear of them via env(safe-area-inset-*) below);
      maximum-scale + user-scalable=no stop a double-tap on a control from zooming the
      page, which would otherwise desync every touch coordinate from the layout.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="data:," />
    <title>Gotcha Force (web)</title>
    <!--
      H1 cross-origin isolation (docs/playable-port-design.md): must be registered
      FIRST, before the app module loads. On header-less static hosts (GitHub
      Pages) the vendored coi-serviceworker re-serves every response with
      COOP/COEP and reloads once on first visit; where the isolation headers are
      already present (Vite dev/preview send them from vite.config.ts) the script
      sees crossOriginIsolated === true and is a no-op, and it also no-ops where
      serviceWorker is unsupported. Vite rewrites the root-absolute public URL
      with the production base (/GotYaForce/game/) at build time.
    -->
    <script src="/coi-serviceworker.js"></script>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #05070c;
        overflow: hidden;
        /* Touch gestures belong to the game, not to the page: without this a drag on the
           analog stick scrolls/pull-to-refreshes instead of steering. */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* dvh tracks the viewport as mobile browser chrome shows and hides; the vh fallback
         keeps desktop and older engines on the previous behaviour. */
      #app { width: 100vw; height: 100vh; height: 100dvh; display: block; }
      /* The on-screen GameCube overlay styles itself, including its safe-area insets;
         see apps/game/src/ui/touch/gcTouchOverlay.ts. */
      #ui { position: fixed; inset: 0; pointer-events: none; color: #e9f2ff; font-family: "Trebuchet MS", system-ui, sans-serif; }
      /* Persistent app chrome that must OUTLIVE screen changes. #ui is the screen host's
         root and createScreenHost.clear() calls root.replaceChildren() on every mount, so
         anything appended straight to #ui is silently detached by the first screen (that is
         what used to strand the debug overlay before its first use). Chrome that has to
         stay — the debug overlay and the ROM-damage status badge — lives here instead. */
      #gf-chrome { position: fixed; inset: 0; pointer-events: none; color: #e9f2ff; font-family: "Trebuchet MS", system-ui, sans-serif; }
      button, input, select { font: inherit; }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="ui"></div>
    <div id="gf-chrome"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
