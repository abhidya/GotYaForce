name: Deploy docs site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'research/**'
      - 'apps/game/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Curate data from research/
        run: node docs-site/scripts/curate-data.mjs

      - name: Build VitePress site
        working-directory: docs-site
        env:
          GH_PAGES_BASE: '/GotYaForce/'
        run: pnpm build

      - name: Build game
        run: pnpm --filter game build

      - name: Assemble Pages artifact
        run: |
          set -euo pipefail
          STAGE="${{ runner.temp }}/pages-stage"
          mkdir -p "$STAGE"
          # Research Atlas -> Pages root
          cp -r docs-site/.vitepress/dist/. "$STAGE/"
          # Game app -> /game/ subpath
          mkdir -p "$STAGE/game"
          cp -r apps/game/dist/. "$STAGE/game/"
          # Disable Jekyll so underscore-prefixed / hashed asset dirs survive
          touch "$STAGE/.nojekyll"
          touch "$STAGE/game/.nojekyll"
          echo "Staged tree:"
          find "$STAGE" -maxdepth 2 -mindepth 1 | sort

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/pages-stage

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
