name: Deploy docs site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'research/**'
      - 'apps/game/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Curate data from research/
        run: node docs-site/scripts/curate-data.mjs

      - name: Build VitePress site
        working-directory: docs-site
        env:
          GH_PAGES_BASE: '/GotYaForce/'
        run: pnpm build

      - name: Build game
        run: pnpm --filter game build

      - name: Assemble Pages artifact
        run: |
          set -euo pipefail
          STAGE="${{ runner.temp }}/pages-stage"
          mkdir -p "$STAGE"
          # Research Atlas -> Pages root
          cp -r docs-site/.vitepress/dist/. "$STAGE/"
          # Game app -> /game/ subpath
          mkdir -p "$STAGE/game"
          cp -r apps/game/dist/. "$STAGE/game/"
          # Disable Jekyll so underscore-prefixed / hashed asset dirs survive
          touch "$STAGE/.nojekyll"
          touch "$STAGE/game/.nojekyll"
          echo "Staged tree:"
          find "$STAGE" -maxdepth 2 -mindepth 1 | sort

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-stage

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
