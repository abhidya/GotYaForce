name: Contributor checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  clean-checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify game and importer
        run: pnpm verify:contributor

      - name: Verify deterministic oracle evidence
        run: pnpm test:oracle

      - name: Build atlas and check internal links
        env:
          GF_ATLAS_SKIP_MODELS: '1'
        run: pnpm verify:docs

      # `curate-data.mjs` copies research/decomp/ghidra-export/chunk_*.c into the
      # committed docs-site/public/chunks/. Nothing enforced that copy, so a corpus
      # correction could (and on 2026-08-26 did) land in research/ while the published
      # atlas kept serving the pre-correction text. The build above regenerates the
      # copy; this fails the run if it differs from what is committed.
      - name: Published decomp chunks must match research/
        run: git diff --exit-code -- docs-site/public/chunks
